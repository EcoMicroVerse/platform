    - software
    - workflow
    - algorithm
    - classifier
    - predictor
    - detector
    - annotation
    - benchmark
    - comparison

  analysis_methods:
    - metagenome
    - metatranscriptome
    - virome
    - MAG
    - host prediction
    - CRISPR
    - prophage induction
    - machine learning
    - deep learning