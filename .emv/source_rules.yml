scan_rules:

  journal:
    frequency: weekly
    max_articles: 20

  preprint:
    frequency: weekly
    max_articles: 15

  github:
    frequency: weekly
    releases_only: true

  conference:
    frequency: weekly

  jobs:
    frequency: weekly

filters:

  language: English

keywords:

  core_topics:
