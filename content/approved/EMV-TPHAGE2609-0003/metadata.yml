summary: >-
  Platelet-phage conjugates (PPCs) are presented as a targeted delivery platform designed to overcome rapid systemic
  clearance and limited tissue targeting of therapeutic phages. By conjugating phages to platelets, PPCs exploit
  platelet inflammatory tropism to localize within infected lung tissue. The study reports increased accumulation at
  pulmonary infection sites, extended circulation half-life, and effective treatment of bacterial pneumonia in mice.
